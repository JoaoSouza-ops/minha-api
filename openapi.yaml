openapi: "3.0.3"
info:
  title: "API Almoxarifado - Patrimônios"
  version: "1.0.0"
  description: "Especificação API-First para o módulo de gestão de patrimônios."
servers:
  - url: "https://dev-api.almoxarifado.gov.br/v1"
    description: "Ambiente de Desenvolvimento"
paths:
  /patrimonios:
    get:
      summary: "Listar patrimônios"
      operationId: "listarPatrimonios"
      tags: ["Patrimônios"]
      responses:
        "200":
          description: "Lista de patrimônios"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatrimonioOutput"
    post:
      summary: "Cadastrar patrimônio"
      operationId: "criarPatrimonio"
      tags: ["Patrimônios"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatrimonioInput"
      responses:
        "201":
          description: "Patrimônio registrado com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatrimonioOutput"
        "400":
          description: "Dados de entrada inválidos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroValidacao"

  /patrimonios/{codigo}:
    get:
      summary: "Buscar patrimônio específico"
      operationId: "buscarPatrimonio"
      tags: ["Patrimônios"]
      parameters:
        - name: codigo
          in: path
          required: true
          description: "Código de identificação (Formatos: NNNNNN ou AAAA-NNNNNN)"
          schema:
            type: string
            pattern: "^([A-Z]{4}-)?\\d{6}$"
      responses:
        "200":
          description: "Patrimônio encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatrimonioOutput"
        "404":
          description: "Patrimônio não localizado no sistema"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroNotFound"
    put:
      summary: "Atualizar dados do patrimônio"
      operationId: "atualizarPatrimonio"
      tags: ["Patrimônios"]
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            pattern: "^([A-Z]{4}-)?\\d{6}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatrimonioInput"
      responses:
        "200":
          description: "Patrimônio atualizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatrimonioOutput"
        "400":
          description: "Dados inválidos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroValidacao"
        "404":
          description: "Patrimônio não localizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroNotFound"
    delete:
      summary: "Baixar/Remover patrimônio"
      operationId: "deletarPatrimonio"
      tags: ["Patrimônios"]
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            pattern: "^([A-Z]{4}-)?\\d{6}$"
      responses:
        "204":
          description: "Baixa realizada com sucesso"
        "404":
          description: "Patrimônio não localizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroNotFound"

components:
  schemas:
    PatrimonioInput:
      type: object
      required: [codigo, descricao, estadoConservacao]
      properties:
        codigo:
          type: string
          pattern: "^([A-Z]{4}-)?\\d{6}$"
          example: "MESA-123456"
          description: "Padrão validador de máscara do patrimônio"
        descricao:
          type: string
          example: "Mesa de escritório em L"
        estadoConservacao:
          type: string
          enum: [BOM, REGULAR, INSERVIVEL]
          example: "BOM"

    PatrimonioOutput:
      type: object
      required: [codigo, descricao, estadoConservacao]
      properties:
        codigo:
          type: string
          pattern: "^([A-Z]{4}-)?\\d{6}$"
          example: "MESA-123456"
          description: "Padrão validador de máscara do patrimônio"
        descricao:
          type: string
          example: "Mesa de escritório em L"
        estadoConservacao:
          type: string
          enum: [BOM, REGULAR, INSERVIVEL]
          example: "BOM"
        criadoEm:
          type: string
          format: date-time
          example: "2025-05-21T10:30:00Z"
          description: "Data e hora de registro do patrimônio"
        atualizadoEm:
          type: string
          format: date-time
          example: "2025-05-21T10:30:00Z"
          description: "Data e hora da última atualização"

    ErroValidacao:
      type: object
      required: [erro, mensagem]
      properties:
        erro:
          type: string
          example: "DADOS_INVALIDOS"
        mensagem:
          type: string
          example: "O campo 'codigo' não corresponde ao padrão esperado."

    ErroNotFound:
      type: object
      required: [erro, mensagem]
      properties:
        erro:
          type: string
          example: "NAO_ENCONTRADO"
        mensagem:
          type: string
          example: "Patrimônio com código 'MESA-123456' não localizado."
